<!DOCTYPE html>
<html>
    <head>
        <title>Circle Chamber</title>
        <script src="/scripts/canvas.js"></script>
        <style>

        body {
            background-color: grey;
        }
        canvas {
            border: 1px solid black;
            background-color: beige;
            margin: 0px;
            padding: 0px;
        }

        </style>
    </head>

    <body>
        <h1>Circle Chamber</h1>
        <h4>Version 1.2</h4>
        <canvas id="myCanvas" width="1475" height="400"></canvas>
        
        <div>
            <h3>Add Balls</h3>
            <button id="addBall">+1</button>
            <button id="addFiveBalls">+5</button>
            <button id="addTenBalls">+10</button>
            <button id="addHundredBalls">+100</button>
            <button id="breakInfinity">DO NOT CLICK</button>
            
            <br><br>

            <h3>Remove Balls</h3>
            <button id="removeBall">-1</button>
            <button id="removeFiveBalls">-5</button>
            <button id="removeTenBalls">-10</button>
            <button id="removeAll">Clear</button>
        </div>
    </body>
</html>
